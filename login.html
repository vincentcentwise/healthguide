<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In | HealthGuide</title>

  <meta
    name="description"
    content="Sign in to your HealthGuide account."
  >

  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <a href="./index.html" class="auth-logo">
        HealthGuide
      </a>


      <div class="auth-header">

        <span class="section-label">
          Welcome Back
        </span>

        <h1>Sign in to HealthGuide</h1>

        <p>
          Access your dashboard, saved resources,
          search history, and personal settings.
        </p>

      </div>


      <form id="login-form" class="auth-form">

        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <div class="password-label">

            <label for="password">
              Password
            </label>

            <a href="./forgot-password.html">
              Forgot password?
            </a>

          </div>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <div
          id="auth-status"
          class="auth-status"
          aria-live="polite"
        ></div>


        <button
          type="submit"
          class="auth-submit"
          id="login-button"
        >
          Sign In
        </button>

      </form>


      <div class="auth-footer">

        <p>
          Don't have an account?
          <a href="./register.html">Create one</a>
        </p>

        <a href="./index.html">
          ← Back to HealthGuide
        </a>

      </div>

    </section>

  </main>


  <script type="module" src="./js/login.js"></script>

</body>
</html>

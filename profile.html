<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Manage your HealthGuide profile."
  >

  <title>My Profile | HealthGuide</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

  <link
    rel="stylesheet"
    href="./css/account-pages.css"
  >

</head>


<body>

  <header id="main-header">

    <div class="header-container">

      <a
        href="./index.html"
        class="logo"
      >
        HealthGuide
      </a>

      <button
        class="menu-toggle"
        id="menu-toggle"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
      >
        ☰
      </button>

      <nav id="main-nav">

        <a href="./index.html">
          Home
        </a>

        <a href="./medicines.html">
          Medicines
        </a>

        <a href="./first-aid.html">
          First Aid
        </a>

        <a href="./healthcare.html">
          Healthcare
        </a>

        <a href="./favorites.html">
          Favorites
        </a>

        <a href="./about.html">
          About
        </a>

      </nav>

    </div>

  </header>


  <main class="account-page">

    <div class="account-container">

      <div class="page-heading">

        <span>
          ACCOUNT
        </span>

        <h1>
          My Profile
        </h1>

        <p>
          Manage your HealthGuide account information.
        </p>

      </div>


      <section class="account-card">

        <form id="profile-form">

          <div class="profile-avatar">

            <div class="avatar-placeholder">
              👤
            </div>

            <div>

              <h2>
                Personal Information
              </h2>

              <p>
                Keep your account information up to date.
              </p>

            </div>

          </div>


          <div class="form-grid">

            <div class="form-field">

              <label for="full-name">
                Full Name
              </label>

              <input
                type="text"
                id="full-name"
                placeholder="Your full name"
              >

            </div>


            <div class="form-field">

              <label for="email">
                Email Address
              </label>

              <input
                type="email"
                id="email"
                placeholder="Your email"
                disabled
              >

            </div>


            <div class="form-field">

              <label for="location">
                Preferred Location
              </label>

              <input
                type="text"
                id="location"
                placeholder="City, Country"
              >

            </div>


            <div class="form-field">

              <label for="account-created">
                Account Created
              </label>

              <input
                type="text"
                id="account-created"
                disabled
                value="Loading..."
              >

            </div>

          </div>


          <div
            id="profile-status"
            class="form-status"
            aria-live="polite"
          ></div>


          <button
            type="submit"
            class="account-button"
          >
            Save Changes
          </button>

        </form>

      </section>

    </div>

  </main>


  <footer id="main-footer">

    <p>
      © 2026 HealthGuide
    </p>

  </footer>


  <script src="./js/account-navigation.js"></script>

</body>

</html>

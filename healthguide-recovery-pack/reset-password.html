<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Set a new HealthGuide account password.">
  <title>Set New Password | HealthGuide</title>
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="page-title">
      <a class="auth-brand" href="./index.html">HealthGuide</a>
      <h1 id="page-title">Set a new password</h1>
      <p id="reset-intro">Create a new password for your HealthGuide account.</p>

      <form id="reset-password-form" novalidate hidden>
        <label for="password">New password</label>
        <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password">

        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" name="confirm-password" type="password" minlength="8" required autocomplete="new-password">

        <button id="reset-submit" type="submit">Update password</button>
      </form>

      <p id="reset-status" role="status" aria-live="polite"></p>
      <p><a href="./login.html">Back to sign in</a></p>
    </section>
  </main>

  <script type="module" src="./js/reset-password.js"></script>
</body>
</html>

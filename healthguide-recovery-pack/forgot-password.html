<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Recover your HealthGuide account password.">
  <title>Forgot Password | HealthGuide</title>
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="page-title">
      <a class="auth-brand" href="./index.html">HealthGuide</a>
      <h1 id="page-title">Forgot your password?</h1>
      <p>Enter the email address connected to your HealthGuide account. If the account exists, we’ll send password-reset instructions.</p>

      <form id="forgot-password-form" novalidate>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required autocomplete="email" inputmode="email">
        <button id="forgot-submit" type="submit">Send reset instructions</button>
      </form>

      <p id="forgot-status" role="status" aria-live="polite"></p>
      <p><a href="./login.html">Back to sign in</a></p>
    </section>
  </main>

  <script type="module" src="./js/forgot-password.js"></script>
</body>
</html>

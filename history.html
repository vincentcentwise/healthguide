<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Your HealthGuide search history."
  >

  <title>Search History | HealthGuide</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

  <link
    rel="stylesheet"
    href="./css/account-pages.css"
  >

</head>


<body>

  <header id="main-header">

    <div class="header-container">

      <a
        href="./index.html"
        class="logo"
      >
        HealthGuide
      </a>

      <button
        class="menu-toggle"
        id="menu-toggle"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
      >
        ☰
      </button>

      <nav id="main-nav">

        <a href="./index.html">
          Home
        </a>

        <a href="./medicines.html">
          Medicines
        </a>

        <a href="./first-aid.html">
          First Aid
        </a>

        <a href="./healthcare.html">
          Healthcare
        </a>

        <a href="./favorites.html">
          Favorites
        </a>

        <a href="./about.html">
          About
        </a>

      </nav>

    </div>

  </header>


  <main class="account-page">

    <div class="account-container">

      <div class="page-heading">

        <span>
          YOUR ACTIVITY
        </span>

        <h1>
          Search History
        </h1>

        <p>
          Review resources and searches you have
          recently explored on HealthGuide.
        </p>

      </div>


      <div class="history-actions">

        <button
          type="button"
          id="clear-history"
        >
          Clear History
        </button>

      </div>


      <section
        id="history-list"
        class="history-list"
      >

        <div class="empty-account-state">

          <div>
            🕘
          </div>

          <h2>
            No search history yet
          </h2>

          <p>
            Your recent HealthGuide searches will
            appear here.
          </p>

          <a href="./medicines.html">
            Search Medicines
          </a>

        </div>

      </section>

    </div>

  </main>


  <footer id="main-footer">

    <p>
      © 2026 HealthGuide
    </p>

  </footer>


  <script src="./js/account-navigation.js"></script>

</body>

</html>

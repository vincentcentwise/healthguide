<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | HealthGuide</title>

  <meta
    name="description"
    content="Create your HealthGuide account and personalize your health information resources."
  >

  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <a href="./index.html" class="auth-logo">
        HealthGuide
      </a>

      <div class="auth-header">
        <span class="section-label">Get Started</span>

        <h1>Create your account</h1>

        <p>
          Save health resources, manage your favorites,
          review your search history, and personalize your
          HealthGuide experience.
        </p>
      </div>


      <form id="register-form" class="auth-form">

        <div class="form-group">

          <label for="full-name">
            Full Name
          </label>

          <input
            type="text"
            id="full-name"
            name="full_name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >

        </div>


        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a strong password"
            autocomplete="new-password"
            minlength="8"
            required
          >

          <small>
            Use at least 8 characters.
          </small>

        </div>


        <div class="form-group">

          <label for="confirm-password">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirm-password"
            name="confirm_password"
            placeholder="Confirm your password"
            autocomplete="new-password"
            minlength="8"
            required
          >

        </div>


        <label class="checkbox-row">

          <input
            type="checkbox"
            id="terms"
            required
          >

          <span>
            I understand that HealthGuide provides educational
            health information and does not replace professional
            medical advice.
          </span>

        </label>


        <div
          id="auth-status"
          class="auth-status"
          aria-live="polite"
        ></div>


        <button
          type="submit"
          class="auth-submit"
          id="register-button"
        >
          Create Account
        </button>

      </form>


      <div class="auth-footer">

        <p>
          Already have an account?
          <a href="./login.html">Sign in</a>
        </p>

        <a href="./index.html">
          ← Back to HealthGuide
        </a>

      </div>

    </section>

  </main>

  <script type="module" src="./js/register.js"></script>

</body>
</html>
